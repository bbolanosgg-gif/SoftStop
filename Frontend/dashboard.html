<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Softstop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importación de las tipografías del diseño -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Marcellus+SC&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Tipografías (las 4 del diseño) */
            --fuente-marca: 'Sora', sans-serif;                           /* SOFTSTOP */
            --fuente-titulo: 'Libre Caslon Text', Georgia, serif;        /* Títulos y mensajes */
            --fuente-texto: 'Google Sans Code', ui-monospace, monospace; /* Texto complementario */
            --fuente-display: 'Marcellus SC', Georgia, serif;            /* DESACELERA, PARA TI... */

            /* Alias por si otra página usa los nombres viejos */
            --fuente-principal: var(--fuente-marca);
            --fuente-secundaria: var(--fuente-texto);

            /* Colores */
            --color-tinta: #3f2a4e;
            --color-texto: #3f2a4e;
            --color-suave: #7a6585;
            --colorfooter: #5d4a6b;
            --color-hero: #1a1a1a;      /* título del hero adaptado */
            --color-marca: #4b1d3d;     /* SOFTSTOP y ENTRAR */
            --rosa-palo: #d68a96;
            --crema-papel: #fbf4ea;
            --logo-morado: #a890fe;
            --color-acento: #d68a96;
            --bg-crema: #f6e6ee;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Contenedor principal con la imagen de fondo */
        .CuerpoDashboard {
            position: relative;
            /* AQUÍ DEBES PONER LA RUTA DE TU IMAGEN DE PAISAJE */
            background: url('img/FondoDasboard.png') center center / cover no-repeat;
            background-color: var(--bg-crema); /* Fallback por si la imagen no carga */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--fuente-texto);
            color: var(--color-texto);
            overflow: hidden;
        }

        /* Cabecera superior */
        .HeaderEspacio {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .TextoBienvenida {
            font-family: var(--fuente-display);
            color: white;
            letter-spacing: 5px;
            font-size: 14px;
            text-transform: uppercase;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        .BotonCerrar {
            position: absolute;
            right: 40px;
            color: white;
            font-family: var(--fuente-marca);
            font-size: 22px;
            text-decoration: none;
            font-weight: 300;
            transition: transform 0.3s ease;
        }

        .BotonCerrar:hover {
            transform: scale(1.2);
        }

        /* Navegación lateral izquierda */
        .NavegacionLateral {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 10;
        }

        /* Línea punteada que conecta los iconos */
        .NavegacionLateral::before {
            content: '';
            position: absolute;
            top: 10%;
            bottom: 10%;
            width: 2px;
            background: repeating-linear-gradient(to bottom, transparent, transparent 8px, rgba(255,255,255,0.7) 8px, rgba(255,255,255,0.7) 16px);
            z-index: -1;
        }

        .IconoNav {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .IconoNav:hover {
            transform: scale(1.15) translateY(-2px);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 15px rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.8);
        }

        .IconoNav img {
            width: 55%;
            height: 55%;
            object-fit: contain;
        }

        /* Contenido Central (Efecto Glassmorphism) */
        .ContenidoCentral {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 5;
            padding: 20px;
        }

        .SaludoUsuario {
            font-family: var(--fuente-titulo);
            font-size: clamp(36px, 5vw, 54px);
            color: var(--color-hero);
            margin-bottom: 25px;
            font-weight: 400;
        }

        .TarjetaCristal {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 35px 50px;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .TarjetaCristal p {
            font-family: var(--fuente-texto);
            font-size: 15px;
            line-height: 1.7;
            color: var(--color-tinta);
            margin-bottom: 20px;
        }

        .TarjetaCristal p:last-child {
            margin-bottom: 0;
        }

        /* Botón Mágico con CSS puro */
        .BotonMagico {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 16px 36px;
            font-family: var(--fuente-texto);
            font-size: 15px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            background: linear-gradient(135deg, var(--rosa-palo), #c2707e);
            border-radius: 50px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 20px rgba(214, 138, 150, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        /* Destello constante que pasa por encima */
        .BotonMagico::before {
            content: '';
            position: absolute;
            top: 0; 
            left: -150%;
            width: 50%; 
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-25deg);
            animation: destello-magico 4s infinite;
            z-index: -1;
        }

        /* Aura interior al pasar el cursor */
        .BotonMagico::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.6);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .BotonMagico:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 
                0 12px 25px rgba(214, 138, 150, 0.6),
                0 0 20px var(--logo-morado); /* Brillo exterior integrando el morado de Softstop */
            border-color: rgba(255,255,255,0.6);
            color: #fff;
        }

        .BotonMagico:hover::after {
            opacity: 1;
        }

        @keyframes destello-magico {
            0% { left: -150%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Adaptabilidad para pantallas más pequeñas */
        @media (max-width: 768px) {
            .NavegacionLateral {
                left: 15px;
            }
            .TarjetaCristal {
                padding: 25px;
                max-width: 85%;
            }
            .SaludoUsuario {
                font-size: 38px;
            }
        }
    </style>
</head>

<body class="CuerpoDashboard">

    <!-- Header superior -->
    <header class="HeaderEspacio">
        <span class="TextoBienvenida">BIENVENIDO A TU ESPACIO</span>
        <!-- Asumiendo que la X de la esquina te saca a otra parte -->
        <a href="login.html" class="BotonCerrar" title="Cerrar">X</a>
    </header>

    <!-- Navegación Lateral (Izquierda) -->
    <nav class="NavegacionLateral">
        <!-- 1. Icono de Cartas -> Funciones.html -->
        <a href="Funciones.html" class="IconoNav" title="Funciones">
            <img src="img/cards.png" alt="Cartas">
        </a>
        
        <!-- 2. Icono Centro -> index.html -->
        <a href="index.html" class="IconoNav" title="Inicio">
            <img src="img/Logo.png" alt="Centro">
        </a>
        
        <!-- 3. Icono Varita Mágica -> journey.html -->
        <a href="journey.html" class="IconoNav" title="Journey">
            <img src="img/vara.png" alt="Varita">
        </a>
    </nav>

    <!-- Contenido central -->
    <main class="ContenidoCentral">
        <h1 class="SaludoUsuario">Hola, Xiomara</h1>
        
        <div class="TarjetaCristal">
            <p>Explora nuestros espacios de calma y encuentra el que necesitas hoy.</p>
            <p>Puedes comenzar con una pausa guiada para respirar, reconectar contigo y volver a tu ritmo.</p>
        </div>

        <!-- Botón mágico hacia tu pausa funcional -->
        <a href="checkin.html" class="BotonMagico">
            Ir a mi pausa funcional
        </a>
    </main>

</body>
</html>
