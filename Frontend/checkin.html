<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in | Softstop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/checkin.css">
</head>

<body class="CuerpoCheckIn">

    <!-- ================= FONDO ANIMADO ================= -->
    <div class="CheckInFondoAnimado" aria-hidden="true">
        <svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80">
            <path class="BlobFondo BlobFondoUno"   d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z"/>
            <path class="BlobFondo BlobFondoDos"   d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z"/>
            <path class="BlobFondo BlobFondoTres"  d="M105.9,48.6c-12.4-8.2-29.3-4.8-39.4.8-23.4,12.8-37.7,51.9-19.1,74.1s63.9,15.3,76-5.6c7.6-13.3,1.8-31.1-2.3-43.8C117.6,63.3,114.7,54.3,105.9,48.6Z"/>
            <path class="BlobFondo BlobFondoCuatro" d="M102,67.1c-9.6-6.1-22-3.1-29.5,2-15.4,10.7-19.6,37.5-7.6,47.8s35.9,3.9,44.5-12.5C115.5,92.6,113.9,74.6,102,67.1Z"/>
        </svg>
        <div class="CheckInVelo"></div>
    </div>

    <div class="PaginaCheckIn">

        <!-- HEADER -->
        <header class="CheckInHeader">
            <span class="CheckInMarca">SOFTSTOP</span>
            <a href="dashboard.html" class="CheckInSalir">Salir</a>
        </header>

        <main class="CheckInPrincipal">

            <!-- Columna Izquierda: Texto -->
            <div class="CheckInIzquierda">
                <div class="CheckInFondo" aria-hidden="true">
                    <div class="BlobFlotante BlobUno"></div>
                    <div class="BlobFlotante BlobDos"></div>
                </div>

                <div class="CheckInTexto">
                    <span class="CheckInEyebrow">Check-in</span>
                    <h1 class="CheckInTitulo">¿Qué te<br>detiene hoy?</h1>
                    <p class="CheckInDescripcion">
                        No tienes que explicarlo.<br>
                        Solo elige lo que más se parece a este momento.
                    </p>
                </div>
            </div>

            <!-- Columna Derecha: Opciones (Reducidas a 3 pilares clave) -->
            <div class="CheckInDerecha">

                <!-- Opción 1: Saturado / Caos mental ➔ RESET -->
                <button class="OpcionCheckIn" id="btnSaturado" data-valor="saturado" style="--color-opcion:#8A6FE8;">
                    <span class="OpcionContenido">
                        <span class="IconoOpcion">
                            <svg viewBox="0 0 60 60" width="30" height="30">
                                <defs>
                                    <linearGradient id="gradSaturado" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#C9BBFF"/>
                                        <stop offset="100%" stop-color="#7A5FE0"/>
                                    </linearGradient>
                                </defs>
                                <path fill="url(#gradSaturado)" d="M39 12C31 9 22 12 18 20c-4 8-1 19 8 24 10 6 23 2 27-8 3-7 1-14-4-19-1 6-6 10-12 9 4-4 4-10 2-14Z"/>
                            </svg>
                        </span>
                        <span class="TextoOpcion">Tengo la cabeza a mil / Estoy saturado</span>
                    </span>
                    <span class="FlechaOpcion">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <span class="OpcionDropShadow"></span>
                </button>

                <!-- Opción 2: Sin energía / Apatía ➔ JOURNAL / UNSTUCK -->
                <button class="OpcionCheckIn" id="btnSinEnergia" data-valor="sin_energia" style="--color-opcion:#3AA9C7;">
                    <span class="OpcionContenido">
                        <span class="IconoOpcion">
                            <svg viewBox="0 0 60 60" width="30" height="30">
                                <defs>
                                    <linearGradient id="gradEmpezar" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#8FE0EC"/>
                                        <stop offset="100%" stop-color="#3AA9C7"/>
                                    </linearGradient>
                                </defs>
                                <path d="M10 34 C16 20, 24 20, 30 30 C36 40, 44 40, 50 26"
                                      stroke="url(#gradEmpezar)" stroke-width="8" stroke-linecap="round" fill="none"/>
                            </svg>
                        </span>
                        <span class="TextoOpcion">No tengo energía / Qué pereza</span>
                    </span>
                    <span class="FlechaOpcion">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <span class="OpcionDropShadow"></span>
                </button>

                <!-- Opción 3: Neutral / Directo a la acción ➔ THINK -->
                <button class="OpcionCheckIn" id="btnOrganizar" data-valor="organizar" style="--color-opcion:#3BBF9A;">
                    <span class="OpcionContenido">
                        <span class="IconoOpcion">
                            <svg viewBox="0 0 60 60" width="30" height="30">
                                <defs>
                                    <radialGradient id="gradAvanzar" cx="35%" cy="30%" r="70%">
                                        <stop offset="0%" stop-color="#B8F0E2"/>
                                        <stop offset="100%" stop-color="#3BBF9A"/>
                                    </radialGradient>
                                </defs>
                                <circle cx="30" cy="30" r="17" fill="url(#gradAvanzar)"/>
                            </svg>
                        </span>
                        <span class="TextoOpcion">Estoy bien, quiero organizarme</span>
                    </span>
                    <span class="FlechaOpcion">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <span class="OpcionDropShadow"></span>
                </button>

            </div>

        </main>

    </div>

    <script src="js/checkin.js"></script>
</body>
</html>
