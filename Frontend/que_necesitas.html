<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in - Fase 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="m-0 p-4 min-h-screen w-full flex justify-center items-center font-sans bg-gradient-to-br from-[#e0c3fc] to-[#8ec5fc]">

    <div class="flex flex-col md:flex-row w-full max-w-5xl bg-white/30 backdrop-blur-xl border border-white/50 rounded-3xl overflow-hidden shadow-[0_8px_32px_0_rgba(31,38,135,0.15)] fade-in">
        
        <!-- Panel Izquierdo: Pregunta -->
        <div class="md:w-5/12 p-10 lg:p-14 flex flex-col justify-center text-left bg-white/10">
            <span class="text-[#9d82f5] font-semibold tracking-wider text-sm mb-4 uppercase">Paso 2</span>
            <h2 class="text-4xl font-bold text-[#333] mb-4 leading-tight">¿Qué sientes que necesitas ahora?</h2>
            <p class="text-[#555] text-lg leading-relaxed">A veces es difícil saber qué pasa. Ayúdanos a entender un poco más para darte el espacio correcto.</p>
        </div>

        <!-- Panel Derecho: Opciones de refinamiento -->
        <div class="md:w-7/12 p-10 lg:p-14 bg-white/50 flex flex-col justify-center gap-4">
            
            <!-- Opción 1: Energía Baja (Fatiga) -->
            <button class="OpcionFase2 w-full p-5 border border-white/60 rounded-2xl bg-white/60 hover:bg-white text-left transition-all duration-300 shadow-sm flex items-center gap-4 group" data-valor="fatiga">
                <span class="text-2xl opacity-70 group-hover:opacity-100 transition-opacity">🔋</span>
                <div>
                    <h3 class="text-[#333] font-semibold text-lg">Un descanso ligero</h3>
                    <p class="text-[#666] text-sm mt-1">Siento cansancio o me cuesta tomar decisiones.</p>
                </div>
            </button>

            <!-- Opción 2: Bloqueo Técnico (Ruta Think) -->
            <button class="OpcionFase2 w-full p-5 border border-white/60 rounded-2xl bg-white/60 hover:bg-white text-left transition-all duration-300 shadow-sm flex items-center gap-4 group" data-valor="bloqueo">
                <span class="text-2xl opacity-70 group-hover:opacity-100 transition-opacity">🧩</span>
                <div>
                    <h3 class="text-[#333] font-semibold text-lg">Resolver un problema</h3>
                    <p class="text-[#666] text-sm mt-1">Tengo un bloqueo específico con un tema o tarea.</p>
                </div>
            </button>

            <!-- Opción 3: Saturación Alta (Ruta Reset) -->
            <button class="OpcionFase2 w-full p-5 border border-white/60 rounded-2xl bg-white/60 hover:bg-white text-left transition-all duration-300 shadow-sm flex items-center gap-4 group" data-valor="desborde">
                <span class="text-2xl opacity-70 group-hover:opacity-100 transition-opacity">🌊</span>
                <div>
                    <h3 class="text-[#333] font-semibold text-lg">Desconectar por completo</h3>
                    <p class="text-[#666] text-sm mt-1">Siento que colapsé y la información es demasiada.</p>
                </div>
            </button>

            <!-- Botón Volver -->
            <button onclick="window.location.href='index.html'" class="mt-4 text-[#888] hover:text-[#9d82f5] text-sm font-medium transition-colors text-center">
                ← Volver al inicio
            </button>
        </div>
    </div>

    <!-- Lógica de Enrutamiento Fase 2 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const opciones = document.querySelectorAll(".OpcionFase2");

            // Diccionario de enrutamiento según tu diagrama de flujo para la Pregunta 2
            const rutasFase2 = {
                "fatiga": "interfaz-simplificada.html", // Disparadores: cansado/a, resistencia a decidir
                "bloqueo": "ruta-think.html",           // Disparadores: túnel cognitivo, ansiedad resolutiva
                "desborde": "funcion-reset.html"           // Disparadores: colapso lógico, parálisis
            };

            opciones.forEach((opcion) => {
                opcion.addEventListener("click", () => {
                    const valor = opcion.dataset.valor; 
                    
                    // Efecto visual de selección rápida
                    opcion.classList.add("ring-2", "ring-[#b8a4f5]", "bg-white");
                    
                    // Pequeño retraso para que el usuario vea que hizo clic antes de cambiar de página
                    setTimeout(() => {
                        if (rutasFase2[valor]) {
                            window.location.href = rutasFase2[valor];
                        }
                    }, 250);
                });
            });
        });
    </script>
</body>
</html>
